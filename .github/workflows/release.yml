name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: alwynpan/docker-wordpress
  # Variant that also gets the `latest` tag.
  LATEST_VARIANT: php8.3-apache

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check git tag matches every Dockerfile base image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mismatched=$(grep -L "^FROM wordpress:${TAG}-" Dockerfile.* || true)
          if [ -n "$mismatched" ]; then
            echo "::error::Base image is not wordpress:${TAG}-* in: ${mismatched//$'\n'/ }"
            exit 1
          fi

  test:
    needs: check-version
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        variant: [apache, fpm, fpm-alpine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          SUFFIX: php${{ matrix.php }}-${{ matrix.variant }}
        run: |
          tags="${IMAGE}:${TAG}-${SUFFIX}"
          if [ "$SUFFIX" = "$LATEST_VARIANT" ]; then tags="${tags},${IMAGE}:latest"; fi
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ steps.tags.outputs.suffix }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ steps.tags.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ steps.tags.outputs.suffix }}
