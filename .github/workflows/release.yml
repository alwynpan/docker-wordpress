name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. 7.1.3
        required: true
        type: string
  schedule:
    # Weekly rebuild of the newest tag to pick up upstream base image fixes.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: alwynpan/docker-wordpress

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      variants: ${{ steps.variants.outputs.variants }}
      latest: ${{ steps.variants.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          newest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          case $EVENT in
            push) tag=$REF_NAME ;;
            workflow_dispatch) tag=$INPUT_TAG ;;
            schedule) tag=$newest ;;
            *) echo "::error::Unsupported event: $EVENT"; exit 1 ;;
          esac
          if ! [[ $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Not an existing release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_newest=$([ "$tag" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check out tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout -q "refs/tags/$TAG"
      - name: Check tag matches every Dockerfile base image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mismatched=$(grep -L "^FROM wordpress:${TAG}-" Dockerfile.* || true)
          if [ -n "$mismatched" ]; then
            echo "::error::Base image is not wordpress:${TAG}-* in: ${mismatched//$'\n'/ }"
            exit 1
          fi
      - name: List variants
        id: variants
        env:
          IS_NEWEST: ${{ steps.tag.outputs.is_newest }}
        run: |
          echo "variants=$(printf '%s\n' Dockerfile.* | sed 's/^Dockerfile\.//' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          # Highest PHP apache variant of the newest release gets `latest`.
          latest=""
          if [ "$IS_NEWEST" = true ]; then
            latest=$(printf '%s\n' Dockerfile.php*-apache | sed 's/^Dockerfile\.//' | sort -V | tail -1)
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  test:
    needs: check-version
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ needs.check-version.outputs.tag }}

  publish:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.check-version.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check-version.outputs.tag }}
      - name: Compute tags
        id: tags
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
          SUFFIX: ${{ matrix.variant }}
          LATEST_VARIANT: ${{ needs.check-version.outputs.latest }}
        run: |
          tags="${IMAGE}:${TAG}-${SUFFIX}"
          if [ "$SUFFIX" = "$LATEST_VARIANT" ]; then tags="${tags},${IMAGE}:latest"; fi
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ steps.tags.outputs.suffix }}
          platforms: linux/amd64,linux/arm64
          # Always fetch the current upstream base so rebuilds pick up its fixes.
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ steps.tags.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ steps.tags.outputs.suffix }}
