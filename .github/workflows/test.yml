name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint shell scripts
        run: shellcheck tests/*.sh scripts/*.sh
      - name: Lint compose files
        run: yamllint -d relaxed docker-compose.yaml docker-compose.fpm.yaml
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.fpm.yaml config -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test set-version script
        run: tests/test-set-version.sh

  dockerfiles:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "list=$(printf '%s\n' Dockerfile.* | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  images:
    needs: dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.dockerfiles.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: tests/test-images.sh "$DOCKERFILE"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test compose examples
        run: tests/test-e2e.sh
